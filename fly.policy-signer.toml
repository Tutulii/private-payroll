  PAYO_AGENT_POLICY_ACCOUNT_ADDRESS = "0x656928a6f3aeb62c2e62ff7457d351a41ed987ceed07c514539165662ecb7e0"
  PAYO_STRK20_POOL_ADDRESS = "0x40337b1af3c663e86e333bab5a4b28da8d4652a15a69beee2b677776ffe812a"
  PAYO_AGENT_SEAL_ADDRESS = "0x1b0208114f33ea0ac800f6474307680a0cf239d13ac11818523f70cba49c84a"
  PAYO_POLICY_SIGNER_MAX_LIFETIME_SECONDS = "31622400"
