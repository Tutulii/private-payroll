app = "private-payroll-prover"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.prover"

[build.args]
  NEXT_PUBLIC_PRIVY_APP_ID = "cmt5d2tnm00kr0ckwkuunxwnu"

[env]
  NEXT_PUBLIC_PRIVY_APP_ID = "cmt5d2tnm00kr0ckwkuunxwnu"
  PAYO_PROVER_THREADS = "2"
  PAYO_SELF_HOSTED_PROVER_ENABLED = "true"
  PAYO_PROVER_ALLOWED_ORIGINS = "https://private-payroll.fly.dev,http://localhost:3000,http://127.0.0.1:3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [http_service.http_options]
    idle_timeout = 900

[[vm]]
  size = "performance-4x"
  memory = "8gb"
