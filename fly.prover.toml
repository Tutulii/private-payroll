app = "private-payroll-prover"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.prover"

[build.args]
  NEXT_PUBLIC_PRIVY_APP_ID = "cmt5d2tnm00kr0ckwkuunxwnu"

[env]
  NEXT_PUBLIC_PRIVY_APP_ID = "cmt5d2tnm00kr0ckwkuunxwnu"
  PAYO_SELF_HOSTED_PROVER_ENABLED = "true"
  PAYO_PROVER_ALLOWED_ORIGINS = "https://private-payroll.fly.dev,http://localhost:3000,http://127.0.0.1:3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 1

  [http_service.http_options]
    idle_timeout = 900

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
