app = "private-payroll"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.prover"

[build.args]
  NEXT_PUBLIC_STARKNET_RPC_URL = "https://api.cartridge.gg/x/starknet/mainnet"
  NEXT_PUBLIC_PAYO_SEAL_ADDRESS = "0x3394e58bb2bb294e0ae92514079a1394c6c66eae8a6c033a6f7f449b1d12ce"
  NEXT_PUBLIC_PAYO_POLICY_REGISTRY_ADDRESS = "0x34701f573096b7bab0e5678e1ed2f17a87c8d56eb5f4d70bcf2197bab8e4477"
  NEXT_PUBLIC_PAYO_OBLIGATION_REGISTRY_ADDRESS = "0x44b22f1a17d2710c2f51ed0b37b8b0ff8435262d3c8c0f2f17be07c84ac23b5"
  NEXT_PUBLIC_PAYO_PROVER_URL = "https://private-payroll-prover.fly.dev"

[deploy]
  release_command = "npm run db:migrate:runtime"

[env]
  NEXT_PUBLIC_STARKNET_RPC_URL = "https://api.cartridge.gg/x/starknet/mainnet"
  NEXT_PUBLIC_PAYO_SEAL_ADDRESS = "0x3394e58bb2bb294e0ae92514079a1394c6c66eae8a6c033a6f7f449b1d12ce"
  NEXT_PUBLIC_PAYO_POLICY_REGISTRY_ADDRESS = "0x34701f573096b7bab0e5678e1ed2f17a87c8d56eb5f4d70bcf2197bab8e4477"
  NEXT_PUBLIC_PAYO_OBLIGATION_REGISTRY_ADDRESS = "0x44b22f1a17d2710c2f51ed0b37b8b0ff8435262d3c8c0f2f17be07c84ac23b5"
  NEXT_PUBLIC_PAYO_PROVER_URL = "https://private-payroll-prover.fly.dev"
  PAYO_API_URL = "https://private-payroll.fly.dev"
  PAYO_AUTH_AUDIENCE = "https://private-payroll.fly.dev"
  PAYO_CHAIN_ID = "0x534e5f4d41494e"
  PAYO_DB_POOL_SIZE = "8"
  PAYO_ENABLE_DEPLOYMENT_OPERATOR = "false"
  PAYO_INDEX_BATCH_SIZE = "50"
  PAYO_INDEX_CHAIN_ID = "SN_MAIN"
  PAYO_INDEX_CONSUMER = "payo-exception-vnext-v1"
  PAYO_INDEX_CONTRACT_ADDRESS = "0x3394e58bb2bb294e0ae92514079a1394c6c66eae8a6c033a6f7f449b1d12ce"
  PAYO_INDEX_FINALITY_LAG = "2"
  PAYO_INDEX_FROM_BLOCK = "14041832"
  PAYO_INDEX_MAX_REORG_DEPTH = "128"
  PAYO_INDEX_PREFETCH_CONCURRENCY = "2"
  PAYO_PROOF_RELAYER_ADDRESS = "0x0126a7a572cf8935d069af937e9f7b27a24949e271e1fbccfe4de0c0d8dc8ea9"
  PAYO_READY_SESSION_HOURS = "12"
  PAYO_OBLIGATION_REGISTRY_ADDRESS = "0x44b22f1a17d2710c2f51ed0b37b8b0ff8435262d3c8c0f2f17be07c84ac23b5"
  PAYO_POLICY_REGISTRY_ADDRESS = "0x34701f573096b7bab0e5678e1ed2f17a87c8d56eb5f4d70bcf2197bab8e4477"
  PAYO_POLICY_REGISTRY_FROM_BLOCK = "13935751"
  PAYO_SEAL_ADDRESS = "0x3394e58bb2bb294e0ae92514079a1394c6c66eae8a6c033a6f7f449b1d12ce"
  PAYO_SELF_HOSTED_PROVER_ENABLED = "false"

[http_service]
  internal_port = 3000
  processes = ["app"]
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[processes]
  app = "npm run start:fly"
