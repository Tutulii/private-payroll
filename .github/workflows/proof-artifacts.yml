name: PayrollIntegrity artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - "circuits/**"
      - "contracts/**"
      - "lib/proof/**"
      - "public/circuits/**"
      - "scripts/*proof*"
      - "scripts/*settlement*"
      - "scripts/test-phase4-policy-account-devnet.mjs"
      - "package*.json"
      - "toolchains.lock.json"
      - ".github/workflows/proof-artifacts.yml"

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HARDWARE_CONCURRENCY: "1"
      PAYO_BB_STORAGE_BUDGET: "2g"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install pinned Noir
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" -v 1.0.0-beta.16

      - name: Install pinned native Barretenberg
        run: |
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          "$HOME/.bb/bbup" -v 3.0.0-nightly.20251104
          "$HOME/.bb/bb" --version

      - name: Install Garaga Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Garaga
        run: pipx install --python python3.12 garaga==1.1.0

      - name: Install pinned Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.16.1
          cache: false
      - name: Install pinned Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v6
        with:
          starknet-foundry-version: 0.57.0
      - name: Install pinned Universal Sierra Compiler
        run: |
          payo_usc_version="$(node -p 'require("./toolchains.lock.json").starknet.universalSierraCompiler')"
          payo_usc_sha="$(node -p 'require("./toolchains.lock.json").starknet.universalSierraCompilerLinuxX64Sha256')"
          payo_usc_archive="/tmp/universal-sierra-compiler-${payo_usc_version}.tar.gz"
          payo_usc_root="/tmp/payo-universal-sierra-compiler"
          curl --fail --location --retry 3 \
            "https://github.com/software-mansion/universal-sierra-compiler/releases/download/v${payo_usc_version}/universal-sierra-compiler-v${payo_usc_version}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$payo_usc_archive"
          echo "${payo_usc_sha}  ${payo_usc_archive}" | sha256sum --check
          mkdir -p "$payo_usc_root"
          tar -xzf "$payo_usc_archive" -C "$payo_usc_root" --strip-components=1
          echo "$payo_usc_root/bin" >> "$GITHUB_PATH"
          test "$("$payo_usc_root/bin/universal-sierra-compiler" --version)" = "universal-sierra-compiler ${payo_usc_version}"

      - name: Enforce pinned Starknet Foundry
        run: |
          test "$(snforge --version)" = "snforge 0.57.0"

      - name: Install pinned standalone Starknet Devnet
        run: |
          payo_devnet_version="$(node -p 'require("./toolchains.lock.json").starknet.starknetDevnet')"
          payo_devnet_sha="$(node -p 'require("./toolchains.lock.json").starknet.starknetDevnetLinuxX64Sha256')"
          payo_devnet_archive="/tmp/starknet-devnet-${payo_devnet_version}.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/starknet-io/starknet-devnet/releases/download/v${payo_devnet_version}/starknet-devnet-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$payo_devnet_archive"
          echo "${payo_devnet_sha}  ${payo_devnet_archive}" | sha256sum --check
          mkdir -p /tmp/payo-starknet-devnet
          tar -xzf "$payo_devnet_archive" -C /tmp/payo-starknet-devnet
          echo "/tmp/payo-starknet-devnet" >> "$GITHUB_PATH"
          test "$(/tmp/payo-starknet-devnet/starknet-devnet --version)" = "starknet-devnet ${payo_devnet_version}"

      - name: Reserve low-memory prover swap
        run: |
          swapon --show
          sudo fallocate -l 4G /mnt/payo-prover.swap
          sudo chmod 600 /mnt/payo-prover.swap
          sudo mkswap /mnt/payo-prover.swap
          sudo swapon /mnt/payo-prover.swap
          free -h

      - name: Test and build the pinned circuit
        working-directory: circuits/payroll_integrity
        run: |
          nargo test
          nargo build
          nargo info
          node -e 'const fs=require("fs"); const built=JSON.parse(fs.readFileSync("target/payo_payroll_integrity.json")); const published=JSON.parse(fs.readFileSync("../../public/circuits/payroll_integrity-v1.json")); for (const key of ["noir_version","hash","abi","bytecode"]) if (JSON.stringify(built[key]) !== JSON.stringify(published[key])) throw new Error(`Published circuit ${key} differs from pinned build`);'

      - name: Enforce the production gate budget
        run: |
          bb gates --scheme ultra_honk --oracle_hash keccak \
            -b circuits/payroll_integrity/target/payo_payroll_integrity.json \
            > circuits/payroll_integrity/target/gates.json
          node -e 'const fs=require("fs"); const gates=JSON.parse(fs.readFileSync("circuits/payroll_integrity/target/gates.json")); const size=gates.functions[0].circuit_size; if (size > 1048576) throw new Error(`Circuit ${size} exceeds the 2^20 production domain`); console.log(`PayrollIntegrity circuit size: ${size}`);'

      - name: Test and size SettlementMatch v8
        run: |
          npm run phase4:settlement:check-generated
          (
            cd circuits/settlement_match
            nargo test --deny-warnings
            nargo build
          )
          node -e 'const fs=require("fs"); const built=JSON.parse(fs.readFileSync("circuits/settlement_match/target/payo_settlement_match.json")); const published=JSON.parse(fs.readFileSync("public/circuits/settlement_match-v8.json")); for (const key of ["noir_version","abi","bytecode","expression_width"]) if (JSON.stringify(built[key]) !== JSON.stringify(published[key])) throw new Error("Published SettlementMatch v8 circuit "+key+" differs from the pinned build");'
          bb gates --scheme ultra_honk --oracle_hash keccak \
            -b circuits/settlement_match/target/payo_settlement_match.json \
            > circuits/settlement_match/target/gates.json
          node -e 'const fs=require("fs"); const gates=JSON.parse(fs.readFileSync("circuits/settlement_match/target/gates.json")); const fn=gates.functions[0]; if (fn.circuit_size > 4194304) throw new Error("SettlementMatch "+fn.circuit_size+" exceeds the 2^22 production domain"); console.log("SettlementMatch ACIR: "+fn.acir_opcodes+"; circuit size: "+fn.circuit_size);'
          mkdir -p circuits/settlement_match/target/ci-vk
          bb write_vk --scheme ultra_honk --oracle_hash keccak \
            -b circuits/settlement_match/target/payo_settlement_match.json \
            -o circuits/settlement_match/target/ci-vk
          node -e 'const fs=require("fs"); const hex=fs.readFileSync("public/circuits/settlement_match-v8.vk.hex","utf8").replace(/\s/g,""); if (!/^[0-9a-f]+$/i.test(hex) || hex.length % 2 !== 0) throw new Error("Committed SettlementMatch v8 VK is malformed"); fs.writeFileSync("circuits/settlement_match/target/committed-vk",Buffer.from(hex,"hex"));'
          cmp circuits/settlement_match/target/ci-vk/vk circuits/settlement_match/target/committed-vk
          NODE_OPTIONS=--max-old-space-size=3072 npm run phase4:settlement:verify-main

      - name: Reproduce the SettlementMatch v8 Garaga verifier
        run: |
          mkdir -p /tmp/payo-settlement-v8-garaga
          cd /tmp/payo-settlement-v8-garaga
          garaga gen \
            --system ultra_keccak_zk_honk \
            --vk "$GITHUB_WORKSPACE/circuits/settlement_match/target/ci-vk/vk" \
            --project-name settlement_verifier_v8
          sed -i \
            's/mod UltraKeccakZKHonkVerifier {/mod PayoSettlementMatchV8Verifier {/' \
            settlement_verifier_v8/src/honk_verifier.cairo
          (cd settlement_verifier_v8 && scarb fmt)
          diff -ruB \
            "$GITHUB_WORKSPACE/contracts/settlement_verifier_v8/src" \
            settlement_verifier_v8/src
          (cd "$GITHUB_WORKSPACE/contracts/settlement_verifier_v8" && scarb build)

      - name: Prove SettlementMatch v8 through the generated Cairo verifier
        run: |
          NODE_OPTIONS=--max-old-space-size=3072 npm run phase4:settlement:witness
          mkdir -p circuits/settlement_match/target/ci-proof
          bb prove --scheme ultra_honk --oracle_hash keccak \
            --slow_low_memory --storage_budget "$PAYO_BB_STORAGE_BUDGET" \
            --vk_policy check \
            -b circuits/settlement_match/target/payo_settlement_match.json \
            -w circuits/settlement_match/target/witness-v8-fixture.gz \
            -k circuits/settlement_match/target/ci-vk/vk \
            -o circuits/settlement_match/target/ci-proof
          bb verify --scheme ultra_honk --oracle_hash keccak \
            -k circuits/settlement_match/target/ci-vk/vk \
            -p circuits/settlement_match/target/ci-proof/proof \
            -i circuits/settlement_match/target/ci-proof/public_inputs
          PAYO_PHASE4_SETTLEMENT_PROOF_DIR=circuits/settlement_match/target/ci-proof \
            PAYO_PHASE4_SETTLEMENT_VK_PATH=circuits/settlement_match/target/ci-vk/vk \
            npm run phase4:settlement:fixture
          (cd contracts/settlement_verifier_v8 && snforge test)

      - name: Reproduce the merged Phase 3 circuit and verification key
        working-directory: circuits/advanced_obligation
        run: |
          nargo test
          nargo build
          # Noir includes test/debug source in the artifact hash. The public proving artifact intentionally strips late test-only metadata, so compare every proof-defining field here; the VK comparison below is the cryptographic identity gate.
          node -e 'const fs=require("fs"); const built=JSON.parse(fs.readFileSync("target/payo_advanced_obligation.json")); const published=JSON.parse(fs.readFileSync("../../public/circuits/advanced_obligation-v2.json")); for (const key of ["noir_version","abi","bytecode","expression_width"]) if (JSON.stringify(built[key]) !== JSON.stringify(published[key])) throw new Error("Published merged Phase 3 circuit "+key+" differs from pinned build");'
          bb gates --scheme ultra_honk --oracle_hash keccak \
            -b target/payo_advanced_obligation.json \
            > target/ci-gates.json
          node -e 'const fs=require("fs"); const gates=JSON.parse(fs.readFileSync("target/ci-gates.json")); const size=gates.functions[0].circuit_size; if (size > 2097152) throw new Error("Merged Phase 3 circuit "+size+" exceeds the 2^21 production domain"); console.log("Merged Phase 3 circuit size: "+size);'
          mkdir -p target/ci-vk
          bb write_vk --scheme ultra_honk --oracle_hash keccak \
            -b target/payo_advanced_obligation.json \
            -o target/ci-vk
          node -e 'const fs=require("fs"); const hex=fs.readFileSync("../../public/circuits/advanced_obligation-v2.vk.hex","utf8").replace(/\s/g,""); if (!/^[0-9a-f]+$/i.test(hex) || hex.length % 2 !== 0) throw new Error("Committed merged Phase 3 VK is malformed"); fs.writeFileSync("target/committed-vk",Buffer.from(hex,"hex"));'
          cmp target/ci-vk/vk target/committed-vk

      - name: Reproduce the merged Phase 3 Garaga verifier
        run: |
          mkdir -p /tmp/payo-advanced-garaga
          cd /tmp/payo-advanced-garaga
          garaga gen \
            --system ultra_keccak_zk_honk \
            --vk "$GITHUB_WORKSPACE/circuits/advanced_obligation/target/ci-vk/vk" \
            --project-name advanced_verifier
          sed -i \
            's/mod UltraKeccakZKHonkVerifier {/mod PayoAdvancedObligationVerifier {/' \
            advanced_verifier/src/honk_verifier.cairo
          (cd advanced_verifier && scarb fmt)
          diff -ruB \
            "$GITHUB_WORKSPACE/contracts/advanced_verifier/src" \
            advanced_verifier/src

      - name: Generate synthetic deployment-bound shard inputs
        env:
          PAYO_WRITE_BROWSER_PROOF_FIXTURE: "true"
        run: npm run proof:input

      - name: Execute both linked witnesses
        working-directory: circuits/payroll_integrity
        run: |
          nargo execute witness-shard-0 --prover-name Prover
          nargo execute witness-shard-1 --prover-name Prover-shard-1

      - name: Generate and self-verify the proof-bound key and both ZK proofs
        run: |
          /usr/bin/time -v -o circuits/payroll_integrity/target/prover-benchmark-resource.txt \
            npm run proof:prove

      - name: Generate deployment-bound full-topology inputs
        env:
          PAYO_PROOF_VALIDITY_START: "86500"
          PAYO_PROOF_VALIDITY_EXPIRY: "87500"
          PAYO_PROOF_DUE_AT: "86400"
          PAYO_PROOF_VALID_UNTIL: "90000"
        run: npm run proof:input -- circuits/payroll_integrity/Prover-phase2.toml

      - name: Execute both full-topology witnesses
        working-directory: circuits/payroll_integrity
        run: |
          nargo execute witness-phase2-shard-0 --prover-name Prover-phase2
          nargo execute witness-phase2-shard-1 --prover-name Prover-phase2-shard-1

      - name: Generate and self-verify both full-topology proofs
        env:
          PAYO_PROOF_ARTIFACT_PROFILE: phase2
          PAYO_PROOF_FIXTURE_OUTPUT_DIR: /tmp/payo-phase2-fixtures
        run: |
          /usr/bin/time -v -o circuits/payroll_integrity/target/prover-benchmark-phase2-resource.txt \
            npm run proof:prove
          cmp \
            circuits/payroll_integrity/target/native3-shard-0/vk \
            circuits/payroll_integrity/target/phase2-shard-0/vk

      - name: Reproduce the Garaga verifier from the proof-bound key
        run: |
          mkdir -p /tmp/payo-garaga-generated
          cd /tmp/payo-garaga-generated
          garaga gen \
            --system ultra_keccak_zk_honk \
            --vk "$GITHUB_WORKSPACE/circuits/payroll_integrity/target/native3-shard-0/vk" \
            --project-name integrity_verifier
          (cd integrity_verifier && scarb fmt)
          diff -ruB \
            "$GITHUB_WORKSPACE/contracts/integrity_verifier/src" \
            integrity_verifier/src

      - name: Validate freshly generated Starknet calldata
        run: |
          node -e 'const fs=require("fs"); for (const profile of ["native3","phase2"]) for (const shard of [0,1]) { const suffix=profile==="native3"?`shard-${shard}`:`phase2-shard-${shard}`; const manifest=JSON.parse(fs.readFileSync(`circuits/payroll_integrity/target/prover-benchmark-${suffix}.json`)); const paths=[`circuits/payroll_integrity/target/proof_calldata-${suffix}.txt`]; if (profile==="native3") paths.push(`contracts/integrity_verifier/tests/proof_calldata-shard-${shard}.txt`); for (const path of paths) { const values=fs.readFileSync(path,"utf8").trim().split(/\s+/); if (values.length !== manifest.calldataFelts) throw new Error(`${path} has ${values.length} felts; expected ${manifest.calldataFelts}`); if (values.some((value) => !/^0x[0-9a-f]+$/i.test(value))) throw new Error(`${path} contains malformed calldata`); } }'

      - name: Build and test committed real proof fixtures in Cairo
        working-directory: contracts/integrity_verifier
        run: |
          scarb build
          snforge test

      # UltraHonk ZK proofs include prover randomness, so a newly generated
      # valid proof must not be byte-compared with a committed valid fixture.
      # Instead, stage this run's proofs and verify them through the generated
      # Cairo verifier, linked bundle, and Payroll Seal integration test.
      - name: Test both freshly generated proofs through the real Cairo integration
        run: |
          cp circuits/payroll_integrity/target/proof_calldata-shard-0.txt \
            contracts/integrity_verifier/tests/proof_calldata-shard-0.txt
          cp circuits/payroll_integrity/target/proof_calldata-shard-1.txt \
            contracts/integrity_verifier/tests/proof_calldata-shard-1.txt
          cp /tmp/payo-phase2-fixtures/proof_calldata-phase2-shard-0.txt \
            contracts/integrity_verifier/tests/proof_calldata-phase2-shard-0.txt
          cp /tmp/payo-phase2-fixtures/proof_calldata-phase2-shard-1.txt \
            contracts/integrity_verifier/tests/proof_calldata-phase2-shard-1.txt
          cd contracts/integrity_verifier
          snforge test

      - name: Build and test the Payroll Seal proof bundle
        working-directory: contracts
        run: |
          scarb build
          snforge test

      - name: Reproduce and test the wage-claim vNext circuits
        run: |
          for profile in obligation_snapshot_link wage_claim_v2 wage_remediation_v2; do
            (
              cd "circuits/$profile"
              nargo test
              nargo build
            )
          done
          node - <<'NODE'
          const fs = require("node:fs");
          const profiles = [
            ["obligation_snapshot_link", "payo_obligation_snapshot_link", "obligation_snapshot_link-v5"],
            ["wage_claim_v2", "payo_wage_claim_v2", "wage_claim-v6"],
            ["wage_remediation_v2", "payo_wage_remediation_v2", "wage_remediation-v7"],
          ];
          for (const [directory, artifact, publishedName] of profiles) {
            const built = JSON.parse(fs.readFileSync(`circuits/${directory}/target/${artifact}.json`));
            const published = JSON.parse(fs.readFileSync(`public/circuits/${publishedName}.json`));
            for (const key of ["noir_version", "abi", "bytecode", "expression_width"]) {
              if (JSON.stringify(built[key]) !== JSON.stringify(published[key])) {
                throw new Error(`${publishedName} ${key} differs from the pinned clean build`);
              }
            }
          }
          NODE

      - name: Generate and self-verify all wage-claim vNext proof vectors
        env:
          PAYO_EXCEPTION_PROOF_FIXTURE_DIR: contracts/exception_vnext_integration/tests
        run: npm run proof:exception:verify

      - name: Pass fresh v5/v6/v7 proofs through their real Cairo verifiers and seal
        working-directory: contracts/exception_vnext_integration
        run: |
          scarb build
          snforge test

      - name: Pass dynamically deployment-bound proofs through standalone RPC Devnet
        run: |
          starknet-devnet \
            --accounts 3 \
            --seed 20260824 \
            --start-time 100 \
            --port 5050 \
            --state-archive-capacity full \
            --proof-mode none \
            > /tmp/payo-starknet-devnet.log 2>&1 &
          payo_devnet_pid=$!
          trap 'kill "$payo_devnet_pid"' EXIT
          for payo_attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5050/is_alive > /dev/null; then break; fi
            if ! kill -0 "$payo_devnet_pid" 2>/dev/null; then
              cat /tmp/payo-starknet-devnet.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5050/is_alive > /dev/null

          npm run phase2:devnet:check-artifacts
          node scripts/test-phase2-devnet.mjs deploy
          payo_deployment="circuits/payroll_integrity/target/phase2-devnet-deployment.json"
          payo_chain_id="$(jq -r .chainId "$payo_deployment")"
          payo_seal_address="$(jq -r .contracts.payrollSeal.address "$payo_deployment")"
          payo_validity_start="$(jq -r .activationAt "$payo_deployment")"
          payo_validity_expiry=$((payo_validity_start + 1000))
          payo_due_at=$((payo_validity_start - 100))
          payo_valid_until="$(jq -r .expiresAt "$payo_deployment")"
          PAYO_PROOF_CHAIN_ID="$payo_chain_id" \
          PAYO_PROOF_SEAL_ADDRESS="$payo_seal_address" \
          PAYO_PROOF_VALIDITY_START="$payo_validity_start" \
          PAYO_PROOF_VALIDITY_EXPIRY="$payo_validity_expiry" \
          PAYO_PROOF_DUE_AT="$payo_due_at" \
          PAYO_PROOF_VALID_UNTIL="$payo_valid_until" \
            npm run proof:input -- circuits/payroll_integrity/Prover-devnet.toml
          (
            cd circuits/payroll_integrity
            nargo execute witness-devnet-shard-0 --prover-name Prover-devnet
            nargo execute witness-devnet-shard-1 --prover-name Prover-devnet-shard-1
          )
          node scripts/test-phase2-devnet.mjs schedule
          PAYO_PROOF_ARTIFACT_PROFILE=devnet npm run proof:prove
          cmp \
            circuits/payroll_integrity/target/native3-shard-0/vk \
            circuits/payroll_integrity/target/devnet-shard-0/vk
          node scripts/test-phase2-devnet.mjs verify

          # Force a clean pinned build before the artifact freshness gate.
          (cd contracts && scarb clean && scarb build)
          npm run phase4:policy:check-artifacts
          npm run phase4:policy:lifecycle

      - name: Run application checks
        run: |
          # The Cairo and Devnet stages above intentionally replace these files
          # with this run's randomized UltraHonk proofs. Restore the committed
          # known vectors before running application tests that assert their
          # fixed Cairo-compatible Poseidon hashes.
          git restore --source=HEAD -- \
            contracts/integrity_verifier/tests/proof_calldata-shard-0.txt \
            contracts/integrity_verifier/tests/proof_calldata-shard-1.txt
          npm run typecheck
          npm test

      - name: Record reproducible artifact hashes
        run: |
          sha256sum \
            public/circuits/payroll_integrity-v1.json \
            public/circuits/payroll_integrity-v1.vk.hex \
            circuits/payroll_integrity/target/native3-shard-0/vk \
            circuits/payroll_integrity/target/native3-shard-0/proof \
            circuits/payroll_integrity/target/native3-shard-0/public_inputs \
            circuits/payroll_integrity/target/native3-shard-1/proof \
            circuits/payroll_integrity/target/native3-shard-1/public_inputs \
            circuits/payroll_integrity/target/proof_calldata-shard-0.txt \
            circuits/payroll_integrity/target/proof_calldata-shard-1.txt \
            > circuits/payroll_integrity/target/SHA256SUMS

      - name: Install the pinned browser
        run: npx playwright install --with-deps chromium
      - name: Build the browser proof harness
        run: npm run build
      - name: Generate and self-verify both proofs in the browser Web Worker
        run: |
          npm start > /tmp/payo-proof-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/proof-benchmark > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-browser-proof.mjs

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: payo-payroll-integrity-${{ github.sha }}
          if-no-files-found: warn
          path: |
            circuits/payroll_integrity/target/payo_payroll_integrity.json
            circuits/payroll_integrity/target/gates.json
            circuits/payroll_integrity/target/native3-shard-0/
            circuits/payroll_integrity/target/native3-shard-1/
            circuits/payroll_integrity/target/phase2-shard-0/
            circuits/payroll_integrity/target/phase2-shard-1/
            circuits/payroll_integrity/target/devnet-shard-0/
            circuits/payroll_integrity/target/devnet-shard-1/
            circuits/payroll_integrity/target/proof_calldata-shard-0.txt
            circuits/payroll_integrity/target/proof_calldata-shard-1.txt
            circuits/payroll_integrity/target/proof_calldata-phase2-shard-0.txt
            circuits/payroll_integrity/target/proof_calldata-phase2-shard-1.txt
            circuits/payroll_integrity/target/proof_calldata-devnet-shard-0.txt
            circuits/payroll_integrity/target/proof_calldata-devnet-shard-1.txt
            circuits/payroll_integrity/target/phase2-devnet-deployment.json
            circuits/payroll_integrity/target/phase2-devnet-evidence.json
            evidence/phase4-policy-account-devnet.json
            circuits/payroll_integrity/target/prover-benchmark*.json
            circuits/payroll_integrity/target/prover-benchmark-resource.txt
            circuits/payroll_integrity/target/browser-proof-benchmark.json
            circuits/payroll_integrity/target/SHA256SUMS
            circuits/settlement_match/target/payo_settlement_match.json
            circuits/settlement_match/target/gates.json
            contracts/integrity_verifier/
