name: PAYO CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payo
          POSTGRES_PASSWORD: payo-ci
          POSTGRES_DB: payo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payo -d payo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Exercise PostgreSQL concurrency and recovery
        env:
          DATABASE_URL: postgresql://payo:payo-ci@127.0.0.1:5432/payo_test
          PAYO_TEST_DATABASE_URL: postgresql://payo:payo-ci@127.0.0.1:5432/payo_test
        run: |
          npm run db:migrate
          npm run test:db
          npm run test:db:phase4-migration
      - name: Install Chromium for rendered production controls
        run: npx playwright install --with-deps chromium
      - name: Exercise rendered Phase 3 production controls
        run: npm run test:browser:phase3
      - name: Exercise rendered Phase 4 production controls
        run: npm run test:browser:phase4
      - name: Upload rendered Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-rendered-browser-evidence
          path: |
            test-results/phase3-browser
            playwright-report
          if-no-files-found: error
          retention-days: 30
      - name: Upload rendered Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-rendered-browser-evidence
          path: |
            test-results/phase4-browser
            playwright-report-phase4
          if-no-files-found: error
          retention-days: 30
      - name: Verify Phase 3 UI-to-proof evidence
        run: |
          npm run phase3:matrix:validate
          npm run phase3:ui:verify-evidence
          npm run phase3:strk20:verify-evidence
          npm run phase3:strk20:verify-exceptions
          npm run phase3:matrix:verify-disclosure
      - name: Verify Phase 4 evidence bindings
        run: npm run phase4:verify-evidence
      - run: npm run lint
      - run: npm run verify:status
      - run: npm run build
