name: PAYO CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Chromium for rendered Phase 3 controls
        run: npx playwright install --with-deps chromium
      - name: Exercise rendered Phase 3 production controls
        run: npm run test:browser:phase3
      - name: Upload rendered Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-rendered-browser-evidence
          path: |
            test-results/phase3-browser
            playwright-report
          if-no-files-found: error
          retention-days: 30
      - name: Verify Phase 3 UI-to-proof evidence
        run: |
          npm run phase3:matrix:validate
          npm run phase3:ui:verify-evidence
          npm run phase3:strk20:verify-evidence
          npm run phase3:strk20:verify-exceptions
          npm run phase3:matrix:verify-disclosure
      - run: npm run lint
      - run: npm run verify:status
      - run: npm run build
