name: PAYO CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_EXPERIMENTAL_USDC: "false"
